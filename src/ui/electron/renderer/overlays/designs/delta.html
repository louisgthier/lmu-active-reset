<div
  class="{{rootClass}}"
  style="width: 360px; height: 96px; box-sizing: border-box; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 2000px rgba(10, 12, 15, {{panelAlpha}}); font-family: 'Barlow Semi Condensed', system-ui, sans-serif; color: #F2F4F6; text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 1px rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 12px 14px"
>
  <div
    style="display: flex; align-items: baseline; justify-content: space-between"
  >
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span
        style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: {{timingFg}}"
        >{{timingTitle}}</span
      >
      <span style="font-size: 11px; font-weight: 500; color: #c2c9d0"
        >{{referenceLabel}}</span
      >
      <span style="font-size: 10px; font-weight: 600; color: {{timingFg}}"
        >{{attemptStatus}}</span
      >
    </div>
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 1px;
      "
    >
      <span
        class="mono"
        style="font-size: 26px; font-weight: 700; line-height: 1; color: {{deltaFg}}"
        >{{deltaTxt}}</span
      >
      <span
        class="mono"
        style="font-size: 11px; font-weight: 500; color: #c2c9d0"
        >{{clockLabel}} {{pred}}</span
      >
    </div>
  </div>
  <div
    style="
      position: relative;
      height: 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.5);
      overflow: hidden;
    "
  >
    <div
      style="
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        display: flex;
        justify-content: flex-end;
      "
    >
      <div
        class="dbar-l"
        style="width: 100%; height: 100%; background: #3DDC84; transform: scaleX({{fastScale}})"
      ></div>
    </div>
    <div
      style="position: absolute; left: 50%; top: 0; width: 50%; height: 100%"
    >
      <div
        class="dbar"
        style="width: 100%; height: 100%; background: #FF5D5D; transform: scaleX({{slowScale}})"
      ></div>
    </div>
    <div
      style="
        position: absolute;
        left: calc(50% - 1px);
        top: 0;
        width: 2px;
        height: 100%;
        background: #f2f4f6;
      "
    ></div>
  </div>
</div>
